<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A personal map of places, photographs, and small moments from the road." />
    <title>Ham Chơi</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛵</text></svg>" />

    <!-- Google Analytics (gtag.js). Loads asynchronously; the page works
         normally if it is blocked or fails. Same snippet in about.html. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5KF8B8BS0E"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5KF8B8BS0E');
    </script>

    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="map-page">
    <!-- Opening flourish: a wireframe globe unrolls into a flat map, then
         fades away to reveal the real map. Clicking skips it. -->
    <div class="globe-intro" aria-hidden="true">
      <!-- Paint order matters: the sphere is the filled water, so it must
           sit under the graticule and the filled land. -->
      <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
        <path class="globe-sphere"></path>
        <path class="globe-graticule"></path>
        <path class="globe-countries"></path>
        <path class="globe-dots"></path>
      </svg>
      <p class="globe-hint">click to skip</p>
    </div>

    <main id="map" aria-label="Interactive map of travel photographs"></main>

    <p class="map-hint" role="note">Tip — some places sit so close together they hide behind one another. Zoom in to separate them, zoom out to travel further.</p>

    <aside class="recent-card" aria-label="Places with the newest photographs">
      <p class="recent-title">Recently</p>
      <div class="recent-list" id="recent-list"></div>
    </aside>

    <nav class="corner-nav" aria-label="Site navigation">
      <a class="wordmark" href="index.html" aria-label="Ham Chơi home">
        <span class="wordmark-mark" aria-hidden="true"></span>
        <span>Ham Chơi</span>
      </a>
      <div class="nav-links">
        <a class="nav-link is-current" href="index.html">Map</a>
        <a class="nav-link" href="about.html">About</a>
        <button class="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
          <span class="theme-icon theme-icon-sun" aria-hidden="true">☼</span>
          <span class="theme-icon theme-icon-moon" aria-hidden="true">◐</span>
        </button>
      </div>
    </nav>

    <aside class="place-panel" aria-hidden="true" aria-labelledby="place-title">
      <div class="panel-handle" aria-hidden="true"></div>
      <div class="panel-inner">
        <div class="panel-header">
          <div>
            <p class="eyebrow" id="place-meta">Travel notes</p>
            <h1 id="place-title"></h1>
            <p class="place-summary" id="place-summary"></p>
          </div>
          <button class="icon-button close-panel" type="button" aria-label="Close place panel">×</button>
        </div>
        <div class="photo-days" id="photo-days"></div>
        <button class="view-all" type="button">View all photographs</button>
      </div>
    </aside>

    <div class="gallery" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="gallery-title">
      <div class="gallery-inner">
        <div class="gallery-header">
          <div>
            <p class="eyebrow" id="gallery-meta"></p>
            <h2 id="gallery-title"></h2>
          </div>
          <button class="icon-button gallery-close" type="button" aria-label="Close all photographs">×</button>
        </div>
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>
    </div>

    <div class="note-view" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="note-title">
      <div class="note-inner">
        <button class="icon-button note-close" type="button" aria-label="Close note">×</button>
        <figure class="note-photo">
          <img id="note-image" src="" alt="" />
        </figure>
        <p class="photo-date" id="note-date"></p>
        <h2 id="note-title"></h2>
        <div class="note-body" id="note-body"></div>
      </div>
    </div>

    <div class="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="lightbox-caption">
      <button class="lightbox-close icon-button" type="button" aria-label="Close photo">×</button>
      <button class="lightbox-arrow lightbox-prev" type="button" aria-label="Previous photo">←</button>
      <div class="lightbox-content">
        <div class="lightbox-image-wrap">
          <img id="lightbox-image" src="" alt="" />
          <div class="lightbox-missing" hidden>Photo not found<br /><span>Add the image to the photos folder.</span></div>
        </div>
        <div class="lightbox-caption">
          <p id="lightbox-date"></p>
          <h2 id="lightbox-caption"></h2>
        </div>
      </div>
      <button class="lightbox-arrow lightbox-next" type="button" aria-label="Next photo">→</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- d3 (array + geo) and topojson-client power the globe intro only; if
         they fail to load, globe-intro.js removes the overlay and the map is
         unaffected. d3-array must come before d3-geo, which builds on it. -->
    <script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js" integrity="sha384-VpKMdU+TlpggHFip46tJ/xkFUs8NFBwLqUMo3+3uiu411lU6eUQYsHVU+JFpA5ja" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js" integrity="sha384-VNiKRUXp0MmglFfqDwkfuk+Y78C3WTJShdKSaFwOacLR3UmamxHIJLBTD3BadIXD" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin=""></script>
    <script src="data.js"></script>
    <script src="world-110m.js"></script>
    <script src="app.js"></script>
    <script src="globe-intro.js"></script>
  </body>
</html>
